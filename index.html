<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oreo Store</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5fa;font-family:Arial;color:#182033}.app{max-width:480px;margin:auto;min-height:100vh;background:#f7f8fc;padding-bottom:75px}header{background:#fff;padding:14px 16px;display:flex;gap:12px;align-items:center;position:sticky;top:0;z-index:4;border-bottom:1px solid #e7eaf0}.logo{width:48px;height:48px;border-radius:50%;background:#173f91;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px}.brand b{display:block;color:#173f91;font-size:20px}.brand span{font-size:11px;color:#7b8495}.banner{margin:14px 15px;padding:22px;border-radius:20px;color:#fff;background:linear-gradient(135deg,#173f91,#5b88d6)}.banner h1{margin:0 0 7px;font-size:24px}.banner p{margin:0;font-size:12px}.notice,.card,.menu{background:#fff;border:1px solid #e8ebf1;border-radius:16px}.notice{margin:0 15px;padding:13px;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 15px}.card{padding:10px}.photo{height:130px;border-radius:13px;background:linear-gradient(135deg,#e8effb,#d5e3ff);display:flex;align-items:center;justify-content:center;color:#173f91;font-weight:900;font-size:26px}.card h3{font-size:14px;margin:9px 2px 4px}.muted{font-size:11px;color:#818a9b}.price{font-size:17px;font-weight:900;margin-top:7px}.btn{border:0;background:#173f91;color:white;border-radius:10px;padding:11px;width:100%;font-weight:800;margin-top:9px}h2{font-size:19px;margin:17px 15px 11px}section{display:none}.show{display:block}.form{padding:20px 15px}.input{width:100%;padding:13px;margin:6px 0;border:1px solid #dfe4ec;border-radius:11px}.link{color:#173f91;font-weight:700;font-size:13px;margin-top:12px}.wallet{margin:15px;padding:20px;border-radius:18px;background:#173f91;color:#fff}.wallet strong{display:block;font-size:30px;margin:4px 0}.menu{margin:0 15px;overflow:hidden}.menu button{display:block;width:100%;text-align:left;padding:16px;background:#fff;border:0;border-bottom:1px solid #eef0f4}.order{margin:10px 15px;padding:14px;background:#fff;border:1px solid #e8ebf1;border-radius:14px}.status{float:right;background:#e9f7ee;color:#21844a;padding:5px 8px;border-radius:12px;font-size:10px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);height:67px;background:#fff;border-top:1px solid #e6e9ef;display:flex;justify-content:space-around}.bottom button{border:0;background:none;color:#8991a0;font-size:11px}.bottom .active{color:#173f91;font-weight:900}</style></head><body><div class="app">
<header><div class="logo">OREO</div><div class="brand"><b>Oreo Store</b><span>Cookie products</span></div></header>
<section id="home" class="show"><div class="banner"><h1>Welcome to Oreo Store 🍪</h1><p>Discover your favourite Oreo products.</p></div><div class="notice">📢 Store Notice: Product prices and orders are shown here.</div><h2>Order Collections</h2><div class="grid" id="collections"></div><h2>Oreo Products</h2><div class="grid" id="products"></div></section>
<section id="login"><div class="form"><h2>Login</h2><input id="le" class="input" placeholder="Email"><input id="lp" class="input" type="password" placeholder="Password"><button class="btn" onclick="login()">Login</button><div class="link" onclick="show('register')">Create account</div></div></section>
<section id="register"><div class="form"><h2>Create Account</h2><input id="rn" class="input" placeholder="Full name"><input id="re" class="input" placeholder="Email"><input id="rp" class="input" placeholder="Phone (optional)"><input id="rpass" class="input" type="password" placeholder="Password"><button class="btn" onclick="register()">Register</button></div></section>
<section id="orders"><h2>My Orders</h2><div id="ordersList"></div></section>
<section id="profile"><div class="wallet"><small>Store Wallet</small><strong>₹0.00</strong><span style="font-size:11px">For store/order use only</span></div><div class="menu"><button onclick="show('orders')">📦 My Orders</button><button onclick="show('home')">🛍️ Shop Products</button><button onclick="alert('Offers section')">🎁 Offers</button><button onclick="alert('Refund/cancellation request')">↩️ Refund / Cancellation</button><button onclick="alert('Customer support')">📞 Customer Support</button></div><div class="form"><div id="profileInfo" class="muted"></div></div></section>
<nav class="bottom"><button id="nh" class="active" onclick="show('home')">⌂<br>Home</button><button id="no" onclick="show('orders')">▣<br>Orders</button><button id="np" onclick="show('profile')">◉<br>Profile</button></nav></div>
<script>
const products=[['Oreo Original',60],['Oreo Mini',40],['Oreo Chocolate',80],['Oreo Family Pack',150],['Oreo Vanilla',75],['Oreo Variety Pack',120]], tiers=[['Starter Order',200],['Regular Order',300],['Family Order',400],['Premium Order',500]];let user=JSON.parse(localStorage.getItem('oreoUser')||'null'),orders=JSON.parse(localStorage.getItem('oreoOrders')||'[]');
function cards(a){return a.map((x,i)=>`<div class="card"><div class="photo">OREO</div><h3>${x[0]}</h3><div class="muted">Product order</div><div class="price">₹${x[1]}</div><button class="btn" onclick="buy(${i},${a===products})">Buy Now</button></div>`).join('')}
function show(id){document.querySelectorAll('section').forEach(x=>x.classList.remove('show'));document.getElementById(id).classList.add('show');if(id==='orders')renderOrders();if(id==='profile')renderProfile()}
function register(){if(!rn.value||!re.value||!rpass.value)return alert('Fill required fields');user={name:rn.value,email:re.value,phone:rp.value,pass:rpass.value};localStorage.setItem('oreoUser',JSON.stringify(user));alert('Account created');show('profile')}
function login(){if(!user||le.value!==user.email||lp.value!==user.pass)return alert('Login failed');alert('Logged in');show('profile')}
function buy(i,isProduct){if(!user){alert('Please register/login first');show('register');return}let x=(isProduct?products:tiers)[i];orders.unshift({name:x[0],total:x[1],date:new Date().toLocaleString()});localStorage.setItem('oreoOrders',JSON.stringify(orders));alert('Order placed');show('orders')}
function renderOrders(){ordersList.innerHTML=orders.length?orders.map(o=>`<div class="order"><span class="status">Placed</span><b>${o.name}</b><br><span class="muted">${o.date}</span><div class="price">₹${o.total}</div></div>`).join(''):'<div class="muted" style="padding:30px;text-align:center">No orders yet.</div>'}function renderProfile(){profileInfo.innerHTML=user?`<b>${user.name}</b><br>${user.email}<br>${user.phone||'Phone not added'}`:'Not logged in'}collections.innerHTML=cards(tiers);products.innerHTML=cards(products);renderOrders();renderProfile();
</script></body></html>
